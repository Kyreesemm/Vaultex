[package]
name = "vaultex-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Encrypted vault primitives for Vaultex"

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1"
